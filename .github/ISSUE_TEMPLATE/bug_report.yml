# /* Pre-emit critique: P5 H5 E5 S5 R5 V5 D5 */
name: "Bug Report"
description: "File an actionable bug report with reproducible steps"
title: "[BUG]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure sensitive network information (such as public IPs or private credentials) is sanitized.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Device state did not update after scan...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS and version are you running?
      options:
        - Windows 11
        - Windows 10
        - Linux (Dev / Daemon)
        - macOS (Dev / Prototype)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NETWATCH Version / Commit
      description: Check the app version or git commit hash.
      placeholder: 0.1.0-dev (commit abc1234)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can the maintainers reproduce this issue?
      placeholder: |
        1. Open NETWATCH
        2. Click 'Run Quick Scan'
        3. See error in logs...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (Optional)
      description: Paste any relevant logs from `%LOCALAPPDATA%\NetWatch\data\netwatch.log` or browser devtools console.
      render: shell
